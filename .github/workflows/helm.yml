name: Validate Helm

# Keyless check: lints the environment charts in devops/ without pulling the private
# iam-cache-server-helm sub-chart, so no cloud credentials are needed. ArgoCD handles deployment.
on:
  pull_request:
    branches:
      - master
      - develop
      - release
      - sandbox

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  helm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Lint environment charts
        # The missing sub-chart is reported as a warning; chart metadata, values files and
        # local templates are still validated and fail the job on errors.
        run: |
          status=0
          for env in dev sandbox staging prod; do
            echo "::group::helm lint devops/$env"
            helm lint "devops/$env" || status=1
            echo "::endgroup::"
          done
          exit $status
